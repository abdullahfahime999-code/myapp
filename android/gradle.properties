# ==========================================
# حافظه‌ی Gradle
# ==========================================
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ==========================================
# فعال‌سازی AndroidX
# ==========================================
android.useAndroidX=true
android.enableJetifier=true

# ==========================================
# فعال‌سازی کش و ساخت سریع‌تر
# ==========================================
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# ==========================================
# جلوگیری از دانلودهای تکراری (مهمترین قسمت)
# ==========================================
org.gradle.daemon=true
org.gradle.vfs.watch=true

# ==========================================
# حالت آفلاین - بعد از اولین بیلد فعال کن!
# ==========================================
org.gradle.offline=true

# ==========================================
# آینه برای دانلودها (اگر اینترنت محدود دارید)
# ==========================================
flutter.sdk.url=https://storage.flutter-io.cn
flutter.host=https://storage.flutter-io.cn

# ==========================================
# نسخه‌های Android SDK
# ==========================================
android.buildToolsVersion=37.0.0
android.compileSdkVersion=36
android.targetSdkVersion=36

# ==========================================
# غیرفعال کردن هشدارها
# ==========================================
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.lintOptions.abortOnError=false
android.lintOptions.checkReleaseBuilds=false

# ==========================================
# افزایش سرعت Kotlin
# ==========================================
kotlin.incremental=true
kotlin.parallel.tasks.in.project=true

# ==========================================
# غیرفعال کردن گزارش‌های اضافی
# ==========================================
org.gradle.logging.level=warn
org.gradle.warning.mode=none