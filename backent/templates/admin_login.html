<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به پنل مدیریت</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0E8A4D, #38C172); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { background: white; border-radius: 24px; padding: 40px 35px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .login-header { text-align: center; margin-bottom: 30px; }
        .login-header .icon { font-size: 50px; margin-bottom: 10px; }
        .login-header h1 { font-size: 24px; font-weight: 700; color: #1a1a1a; }
        .login-header p { font-size: 14px; color: #888; margin-top: 4px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: 600; color: #555; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 15px; transition: all 0.3s; font-family: inherit; background: #fafafa; }
        .form-group input:focus { border-color: #0E8A4D; outline: none; background: white; box-shadow: 0 0 0 4px rgba(14, 138, 77, 0.1); }
        .form-group input::placeholder { color: #bbb; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(135deg, #0E8A4D, #38C172); color: white; border: none; border-radius: 12px; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.3s; font-family: inherit; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(14, 138, 77, 0.35); }
        .btn-login:active { transform: translateY(0); }
        .error-message { background: #fce4ec; color: #e74c3c; padding: 12px 16px; border-radius: 12px; font-size: 14px; margin-bottom: 16px; border-right: 4px solid #e74c3c; display: none; }
        .error-message.show { display: block; animation: shake 0.4s ease; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
        .login-footer { text-align: center; margin-top: 20px; font-size: 13px; color: #999; }
        .login-footer a { color: #0E8A4D; text-decoration: none; font-weight: 600; }
        .login-footer a:hover { text-decoration: underline; }
        @media (max-width: 480px) { .login-container { padding: 30px 20px; } .login-header h1 { font-size: 20px; } .btn-login { font-size: 16px; padding: 12px; } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="icon">🔐</div>
            <h1>ورود به پنل مدیریت</h1>
            <p>لطفاً اطلاعات خود را وارد کنید</p>
        </div>

        <div class="error-message" id="errorMessage">
            ⚠️ نام کاربری یا رمز عبور اشتباه است
        </div>

        <form action="/admin_login" method="POST" id="loginForm">
            <div class="form-group">
                <label>👤 نام کاربری</label>
                <input type="text" id="username" name="username" placeholder="نام کاربری خود را وارد کنید" required autofocus>
            </div>
            <div class="form-group">
                <label>🔑 رمز عبور</label>
                <input type="password" id="password" name="password" placeholder="رمز عبور خود را وارد کنید" required>
            </div>
            <button type="submit" class="btn-login">🚀 ورود به مدیریت</button>
        </form>

        <div class="login-footer">
            <a href="/">بازگشت به صفحه اصلی</a>
        </div>
    </div>

    <script>
        {% if error %}
        const errorEl = document.getElementById('errorMessage');
        errorEl.textContent = '⚠️ {{ error }}';
        errorEl.classList.add('show');
        {% endif %}

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('errorMessage');
            if (!username || !password) {
                e.preventDefault();
                errorEl.textContent = '⚠️ لطفاً همه فیلدها را پر کنید';
                errorEl.classList.add('show');
                return;
            }
            errorEl.classList.remove('show');
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', function() {
                document.getElementById('errorMessage').classList.remove('show');
            });
        });
    </script>
</body>
</html>
