name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android SDK and accept licenses
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export PATH=$PATH:$ANDROID_HOME/tools/bin:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses || true
        yes | sdkmanager "ndk;30.0.14904198" || true
    
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.41.2'
    
    - name: دریافت وابستگی‌ها
      run: flutter pub get
    
    - name: ساخت APK
      run: flutter build apk --debug --no-tree-shake-icons
    
    - uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: build/app/outputs/flutter-apk/*.apk